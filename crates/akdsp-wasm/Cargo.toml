[package]
name = "akdsp-wasm"
description = "wasm-bindgen bindings for akdsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
akdsp = { path = "../akdsp" }
# Must match the installed wasm-bindgen-cli version exactly (scripts/doctor.sh checks this).
wasm-bindgen = "=0.2.129"
