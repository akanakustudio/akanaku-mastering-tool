[package]
name = "akdsp-wasm"
description = "wasm-bindgen bindings for akdsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
akdsp = { path = "../akdsp" }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
# Must match the installed wasm-bindgen-cli version exactly (scripts/doctor.sh checks this).
wasm-bindgen = "=0.2.129"
